    // =========================================================================
    // إدارة الحالة (State Management) والتخزين المحلي
    // =========================================================================
    let currentView = 'home'; // 'home' | 'glossary' | lesson.id
    let currentTab = 'summary'; // 'summary' | 'quiz' | 'written'
    let completedItems = JSON.parse(localStorage.getItem('ss_g8_completed') || '[]');
    let studentProfile = JSON.parse(localStorage.getItem('ss_g8_student') || '{"name":"","classroom":""}');
    let userAnswers = {}; // تخزين إجابات الطالب في الاختبار الحالي

    // التحقق من عرض شاشة البداية قبل الصفحة الرئيسية
    function initWelcomeGate() {
      const gate = document.getElementById('welcomeGateScreen');
      const nameInput = document.getElementById('gateStudentName');
      const classInput = document.getElementById('gateStudentClass');
      if (nameInput) nameInput.value = studentProfile.name || '';
      if (classInput) classInput.value = studentProfile.classroom || '';

      if (studentProfile.name && studentProfile.classroom) {
        gate.classList.add('hidden');
      } else {
        gate.classList.remove('hidden');
      }
    }

    // الدخول من شاشة البداية إلى الصفحة الرئيسية
    function enterPlatform(event) {
      if (event) event.preventDefault();
      const nameVal = document.getElementById('gateStudentName').value.trim();
      const classVal = document.getElementById('gateStudentClass').value.trim();
      if (!nameVal || !classVal) return;

      studentProfile = { name: nameVal, classroom: classVal };
      localStorage.setItem('ss_g8_student', JSON.stringify(studentProfile));
      updateStudentHeaderBadge();

      document.getElementById('welcomeGateScreen').classList.add('hidden');
      renderHome();
      showToast(`أهلاً بك يا ${nameVal} في منصة الدراسات الاجتماعية!`, 'fa-user-check text-emerald-400');
    }

    // إعادة فتح شاشة البيانات لتعديل الاسم أو الفصل
    function openWelcomeGate() {
      const gate = document.getElementById('welcomeGateScreen');
      document.getElementById('gateStudentName').value = studentProfile.name || '';
      document.getElementById('gateStudentClass').value = studentProfile.classroom || '';
      gate.classList.remove('hidden');
    }

    function updateStudentHeaderBadge() {
      const badge = document.getElementById('headerStudentBadge');
      if (!badge) return;
      if (studentProfile.name || studentProfile.classroom) {
        const parts = [];
        if (studentProfile.name) parts.push(`الطالب/ة: ${studentProfile.name}`);
        if (studentProfile.classroom) parts.push(`فصل: ${studentProfile.classroom}`);
        badge.textContent = parts.join(' • ');
      } else {
        badge.textContent = 'الصف الثاني الإعدادي • الترم الأول';
      }
    }

    // تهيئة الوضع الليلي
    function initTheme() {
      const savedTheme = localStorage.getItem('ss_g8_theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun';
      }
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('ss_g8_theme', isDark ? 'dark' : 'light');
      document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    }

    // إظهار رسالة تنبيه أنيقة (Toast)
    function showToast(msg, iconClass = 'fa-circle-check text-emerald-400') {
      const box = document.getElementById('toastBox');
      document.getElementById('toastMessage').textContent = msg;
      document.getElementById('toastIcon').className = `fa-solid ${iconClass} text-lg`;
      box.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        box.classList.add('translate-y-20', 'opacity-0');
      }, 2800);
    }

    // فتح/إغلاق القائمة الجانبية على الموبايل
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.toggle('translate-x-full');
      overlay.classList.toggle('hidden');
    }

    // تبديل حالة إتمام الدرس
    function toggleComplete(id) {
      if (completedItems.includes(id)) {
        completedItems = completedItems.filter(item => item !== id);
        showToast('تم إلغاء علامة الإتمام للدرس', 'fa-rotate-left text-amber-400');
      } else {
        completedItems.push(id);
        showToast('أحسنت! تم تسجيل إتمام الدرس بنجاح', 'fa-circle-check text-emerald-400');
      }
      localStorage.setItem('ss_g8_completed', JSON.stringify(completedItems));
      updateProgressUI();
      renderSidebar();
      if (currentView !== 'home' && currentView !== 'glossary') {
        renderLesson(currentView);
      }
    }

    function updateProgressUI() {
      const total = CURRICULUM_DATA.length;
      const done = completedItems.length;
      const pct = Math.round((done / total) * 100);
      document.getElementById('progressBadge').textContent = `${done} / ${total} مكتمل`;
      document.getElementById('progressPercent').textContent = `${pct}%`;
      document.getElementById('progressBar').style.width = `${pct}%`;
    }

      currentTab = 'summary';
      userAnswers = {};
      renderSidebar();

      const sidebar = document.getElementById('sidebar');
      if (!sidebar.classList.contains('translate-x-full') && window.innerWidth < 1024) {
        toggleSidebar();
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (id === 'home') {
        renderHome();

        renderGlossary();
      } else {
        renderLesson(id);

            <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 sm:p-5 border border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-amber-100 dark:bg-amber-950 text-amber-600 flex items-center justify-center text-xl">
                  <i class="fa-solid fa-star"></i>
                </div>
                <div>
                  <div class="text-sm font-extrabold">اختبار تفاعلي على: ${item.title}</div>
                  <div class="text-xs text-slate-500">اختر الإجابة الصحيحة وسيظهر لك التصحيح والتعليل فورًا</div>
                </div>
              </div>
              <div class="flex items-center gap-3">
                <span class="px-4 py-1.5 rounded-xl bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 text-sm font-black">
                  النتيجة: ${correctCount} / ${totalQ}
                </span>
                ${answeredCount > 0 ? `
                  <button onclick="resetQuiz('${item.id}')" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-xs font-bold transition">
                    إعادة المحاولة
                  </button>
                ` : ''}
              </div>
            </div>

            <!-- الأسئلة -->
            <div class="space-y-4">
              ${item.quiz.map((qObj, qIdx) => {
                const chosen = userAnswers[qIdx];
                const isAnswered = chosen !== undefined;
                return `
                  <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 border border-slate-200 dark:border-slate-800 shadow-xs space-y-4">
                    <div class="flex items-start gap-3">
                      <span class="w-7 h-7 rounded-lg bg-sky-600 text-white text-xs font-black flex items-center justify-center shrink-0 mt-0.5">${qIdx + 1}</span>
                      <h4 class="text-base sm:text-lg font-bold text-slate-900 dark:text-white leading-snug">${qObj.q}</h4>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                      ${qObj.options.map((opt, optIdx) => {
                        let btnStyle = 'bg-slate-50 dark:bg-slate-800/70 border-slate-200 dark:border-slate-700 hover:border-sky-500 text-slate-700 dark:text-slate-200';
                        let icon = '<span class="w-5 h-5 rounded-full border border-slate-300 dark:border-slate-600 inline-block shrink-0"></span>';

                        if (isAnswered) {
                          if (optIdx === qObj.answer) {
                            btnStyle = 'bg-emerald-50 dark:bg-emerald-950/60 border-emerald-500 text-emerald-800 dark:text-emerald-200 font-bold';
                            icon = '<i class="fa-solid fa-circle-check text-emerald-500 text-lg shrink-0"></i>';
                          } else if (optIdx === chosen && chosen !== qObj.answer) {
                            btnStyle = 'bg-rose-50 dark:bg-rose-950/60 border-rose-500 text-rose-800 dark:text-rose-200 font-bold';
                            icon = '<i class="fa-solid fa-circle-xmark text-rose-500 text-lg shrink-0"></i>';
                          } else {
                            btnStyle = 'bg-slate-50/50 dark:bg-slate-800/30 border-slate-200 dark:border-slate-800 opacity-60';
                          }
                        }

                        return `
                          <button onclick="answerQuiz('${item.id}', ${qIdx}, ${optIdx})" ${isAnswered ? 'disabled' : ''} class="p-3.5 rounded-2xl border-2 text-right text-sm transition flex items-center gap-3 ${btnStyle}">
                            ${icon}
                            <span>${opt}</span>
                          </button>
                        `;
                      }).join('')}
                    </div>

                    ${isAnswered ? `
                      <div class="p-3.5 rounded-2xl text-xs sm:text-sm font-semibold flex items-start gap-2.5 ${
                        chosen === qObj.answer
                          ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800'
                          : 'bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-300 border border-amber-200 dark:border-amber-800'
                      }">
                        <i class="fa-solid fa-circle-info mt-0.5"></i>
                        <span><strong>التوضيح:</strong> ${qObj.explanation}</span>
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      // 3. تبويب الأسئلة المقالية ونموذج الإجابة
      if (currentTab === 'written') {
        return `
          <div class="space-y-4">
            <div class="bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800/50 rounded-2xl p-4 text-xs sm:text-sm text-emerald-800 dark:text-emerald-300 font-semibold flex items-center gap-2">
              <i class="fa-solid fa-eye"></i>
              <span>حاول التفكير في الإجابة أولاً، ثم اضغط على زر «إظهار الإجابة النموذجية» للتحقق من إجابتك.</span>
            </div>

            ${item.writtenQA.map((qa, idx) => `
              <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 border border-slate-200 dark:border-slate-800 shadow-xs space-y-4">
                <div class="flex items-start gap-3">
                  <span class="px-2.5 py-1 rounded-lg bg-emerald-600 text-white text-xs font-black shrink-0">س ${idx + 1}</span>
                  <h4 class="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white leading-snug">${qa.q}</h4>
                </div>

                <div>
                  <button onclick="toggleWrittenAnswer('ans_${idx}')" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-emerald-100 dark:hover:bg-emerald-950 text-slate-700 dark:text-slate-200 text-xs font-bold transition flex items-center gap-2 no-print">
                    <i class="fa-solid fa-key text-emerald-600"></i>
                    <span>إظهار / إخفاء الإجابة النموذجية</span>
                  </button>
                  <div id="ans_${idx}" class="hidden mt-3 p-4 rounded-2xl bg-emerald-50/70 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/60 text-sm text-slate-800 dark:text-slate-200 leading-relaxed">
                    <strong class="text-emerald-700 dark:text-emerald-400">الإجابة النموذجية:</strong> ${qa.a}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }
    }

    function answerQuiz(lessonId, qIdx, optIdx) {
      userAnswers[qIdx] = optIdx;
      const item = CURRICULUM_DATA.find(d => d.id === lessonId);
      if (item && item.quiz[qIdx].answer === optIdx) {
        showToast('إجابة صحيحة! أحسنت', 'fa-circle-check text-emerald-400');
      } else {
        showToast('إجابة غير صحيحة، راجع التوضيح', 'fa-circle-xmark text-rose-400');
      }
      renderLesson(lessonId);
    }

    function resetQuiz(lessonId) {
      userAnswers = {};
      renderLesson(lessonId);
    }

    function toggleWrittenAnswer(elemId) {
      const el = document.getElementById(elemId);
      if (el) el.classList.toggle('hidden');
    }

    // =========================================================================
    // البحث الفوري في المنهج
    // =========================================================================
    function handleSearch(query) {
      const dropdown = document.getElementById('searchResultsDropdown');
      const q = query.trim().toLowerCase();

      if (!q) {
        if (dropdown) dropdown.classList.add('hidden');
        return;
      }

      const matches = [];
      CURRICULUM_DATA.forEach(item => {
        if (item.title.toLowerCase().includes(q)) {
          matches.push({ title: item.title, sub: item.unitTitle, id: item.id, type: 'درس' });
        }
        if (item.concepts) {
          item.concepts.forEach(c => {
            if (c.term.toLowerCase().includes(q) || c.def.toLowerCase().includes(q)) {
              matches.push({ title: c.term, sub: c.def.slice(0, 65) + '...', id: item.id, type: 'مصطلح' });
            }
          });
        }
      });

      if (dropdown) {
        dropdown.classList.remove('hidden');
        if (matches.length === 0) {
          dropdown.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">لا توجد نتائج مطابقة لـ "${query}"</div>`;
        } else {
          dropdown.innerHTML = matches.slice(0, 8).map(m => `
            <button onclick="selectItem('${m.id}'); document.getElementById('searchResultsDropdown').classList.add('hidden');" class="w-full text-right p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-start justify-between gap-2">
              <div>
                <div class="text-xs font-extrabold text-slate-800 dark:text-white">${m.title}</div>
                <div class="text-[11px] text-slate-500 line-clamp-1">${m.sub}</div>
              </div>
              <span class="text-[10px] px-2 py-0.5 rounded-md bg-sky-100 dark:bg-sky-950 text-sky-700 dark:text-sky-300 font-bold shrink-0">${m.type}</span>
            </button>
          `).join('');
        }
      }
    }

    // إغلاق قائمة البحث عند النقر خارجها
    document.addEventListener('click', (e) => {
      const dropdown = document.getElementById('searchResultsDropdown');
      const input = document.getElementById('searchInput');
      if (dropdown && input && !dropdown.contains(e.target) && !input.contains(e.target)) {
        dropdown.classList.add('hidden');
      }
    });

    // =========================================================================
    // تشغيل التطبيق عند التحميل
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initWelcomeGate();
      updateStudentHeaderBadge();
      updateProgressUI();
      renderSidebar();
      renderHome();
    });
  </script>
</body>
</html>
